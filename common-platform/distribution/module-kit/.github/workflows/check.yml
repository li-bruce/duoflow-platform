name: Module kit checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements.lock.txt
      - run: npm ci
      - run: python -m unittest discover -s tests -v
      - run: mkdir -p work && python -m pytest templates/module-kit/sdk/python/tests -q --basetemp work/sdk-tests
      - run: mkdir -p work && python scripts/module_kit.py scaffold --template workflow-node --module-id example.ci --title "合成模块" --output work/module
      - run: node --test tests/workflow.test.mjs
        working-directory: work/module
